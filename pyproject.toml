[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dukapulse"
version = "0.1.0"
description = "Micro-Retail Inventory Intelligence & Concurrency Guard built with Tiger Data and Auth0"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Prince NZAMUWE", email = "princenzamuwe@gmail.com" }
]

[tool.setuptools.packages.find]
include = ["dukapulse*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/streamlit_app.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
