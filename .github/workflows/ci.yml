name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      timescale:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dukapulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        pip install -e .

    - name: Lint with ruff
      run: |
        ruff check .

    - name: Run unit test suite
      run: |
        python -m pytest tests/ -m "not integration" -v

    - name: Run real-engine integration test suite
      env:
        DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dukapulse_test
      run: |
        python -m pytest tests/ -m integration -v
